[project]
name = "memleak"
version = "0.1.0"
description = "MemLeak: Diagnosing Information Leaks in Multimodal Agent Memory"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
mem0 = ["mem0ai>=0.1"]
letta = ["letta>=0.4"]
graphiti = ["graphiti-core>=0.4"]

[tool.setuptools.packages.find]
include = ["memleak*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
